name: vin_technician_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  geocoding: ^5.0.0
  geolocator: ^14.0.1
  go_router: ^18.0.2
  google_maps_flutter: ^2.18.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
